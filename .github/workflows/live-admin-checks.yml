name: Live admin verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # All live runs share the same existing database and must run serially.
  group: live-admin-fdctgtncawolrapwwevm
  cancel-in-progress: false

jobs:
  real-supabase:
    # This credential is authorised only for the reviewed PR #6 branch.
    # Other PRs and manual refs must never run live writes automatically.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.number == 6 &&
       github.event.pull_request.head.ref == 'fix/production-admin' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/fix/production-admin')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://fdctgtncawolrapwwevm.supabase.co
      # Public client key only. Auth, guarded RPCs and RLS protect all records.
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_6VBwZ_uNQJsUQ6ygEWtUWg_T_LlGL3K
      E2E_RUN_LIVE: "1"
      E2E_BASE_URL: http://localhost:3000
    steps:
      - name: Require privately provisioned administrator credentials
        env:
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          node -e 'if (!process.env.E2E_ADMIN_PASSWORD || process.env.E2E_ADMIN_PASSWORD.length < 8) { console.error("BLOCKED: Confirm Mike in Supabase Auth, then configure the private repository Actions secret E2E_ADMIN_PASSWORD. No authenticated workflow has run."); process.exit(1); }'
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Build the reviewed application
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify real login, cross-browser persistence and customer isolation
        env:
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npm run test:e2e:live
      # Never upload live traces, DOM snapshots, cookies or other artifacts.
