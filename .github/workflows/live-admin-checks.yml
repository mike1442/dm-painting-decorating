name: Live admin verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-workflow:
    # The complete desktop/mobile admin suite against a disposable PostgreSQL
    # database running the real migrations behind an emulated Supabase gateway.
    # It needs no secret and never reaches the hosted project, so every change is
    # proven here before any live run. See tests/isolated/README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: isolated-workflow-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dm_isolated
          POSTGRES_USER: postgres
          # Disposable CI-only password for this isolated service container.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dm_isolated"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      ISOLATED_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-client
          fi
      - name: Route the application's pinned Supabase hostname to the local emulator
        run: echo "127.0.0.1 fdctgtncawolrapwwevm.supabase.co" | sudo tee -a /etc/hosts
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Build and verify the complete admin workflow on desktop and mobile
        run: npm run test:e2e:isolated
      # Isolated fixtures only; nothing is uploaded.

  real-supabase:
    needs: isolated-workflow
    # This credential is authorised only for the reviewed PR #6 branch.
    # Other PRs and manual refs must never run live writes automatically.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.number == 6 &&
       github.event.pull_request.head.ref == 'fix/production-admin' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/fix/production-admin')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # All live runs share the same existing database and must run serially.
      group: live-admin-fdctgtncawolrapwwevm
      cancel-in-progress: false
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://fdctgtncawolrapwwevm.supabase.co
      # Public client key only. Auth, guarded RPCs and RLS protect all records.
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_6VBwZ_uNQJsUQ6ygEWtUWg_T_LlGL3K
      E2E_RUN_LIVE: "1"
      E2E_BASE_URL: http://localhost:3000
    steps:
      - name: Require privately provisioned administrator credentials
        env:
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          node -e 'if (!process.env.E2E_ADMIN_PASSWORD || process.env.E2E_ADMIN_PASSWORD.length < 8) { console.error("BLOCKED: Confirm Mike in Supabase Auth, then configure the private repository Actions secret E2E_ADMIN_PASSWORD. No authenticated workflow has run."); process.exit(1); }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Verify private credentials directly with Supabase
        env:
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: node scripts/verify-supabase-login.mjs
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Build the reviewed application
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify real login, cross-browser persistence and customer isolation
        env:
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npm run test:e2e:live
      # Never upload live traces, DOM snapshots, cookies or other artifacts.

  protected-preview:
    needs: real-supabase
    if: >-
      success() &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.number == 6 &&
        github.event.pull_request.head.ref == 'fix/production-admin' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/fix/production-admin'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: live-admin-fdctgtncawolrapwwevm
      cancel-in-progress: false
    permissions:
      contents: read
      statuses: read
      id-token: write
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_BASE_URL: https://dm-painting-decorating-git-fix-production-admin-mike-b7b4.vercel.app
      E2E_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify the reviewed protected preview with fresh scoped OIDC identities
        env:
          GITHUB_TOKEN: ${{ github.token }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: node scripts/verify-live-preview.mjs
      # No build/server, long-lived bypass, debug mode, or artifact upload.
