name: Live admin verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-admin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-supabase:
    # Fork PRs never receive the private administrator test credential.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://kqjbgvjgsvbjflumorjr.supabase.co
      # Public client key only. Auth, guarded RPCs and RLS protect all records.
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_1ID4jYUodJD7eE9fHVkR1w_1g7dp5qa
      E2E_RUN_LIVE: "1"
      E2E_BASE_URL: http://localhost:3000
    steps:
      - name: Require privately provisioned administrator credentials
        env:
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          node -e 'if (!process.env.E2E_ADMIN_PASSWORD || process.env.E2E_ADMIN_PASSWORD.length < 8) { console.error("BLOCKED: Confirm Mike in Supabase Auth, then configure the private repository Actions secret E2E_ADMIN_PASSWORD. No authenticated workflow has run."); process.exit(1); }'
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Build the reviewed application
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify real login, cross-browser persistence and customer isolation
        env:
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npm run test:e2e:live
      # Never upload live traces, DOM snapshots, cookies or other artifacts.
