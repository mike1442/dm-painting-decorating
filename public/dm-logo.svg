<svg xmlns="http://www.w3.org/2000/svg" viewBox="155 10 570 395" role="img" aria-labelledby="title desc"><title id="title">D&amp;M Painting &amp; Decorating</title><desc id="desc">Premium D and M logo with a teal painted roofline.</desc><style>.stroke{stroke-dasharray:850;stroke-dashoffset:850;animation:draw 2.2s ease forwards .35s}.brush{transform-origin:650px 95px;animation:brush 2.2s ease-out both .3s}.word{opacity:0;animation:fade .9s ease forwards 1s}@keyframes draw{to{stroke-dashoffset:0}}@keyframes brush{from{transform:translate(-60px,30px) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}@keyframes fade{to{opacity:1}}@media(prefers-reduced-motion:reduce){.stroke,.brush,.word{animation:none;stroke-dashoffset:0;opacity:1}}</style><path class="stroke" d="M180 178 Q350 150 460 64 L568 146" fill="none" stroke="#78c5be" stroke-width="23" stroke-linecap="round"/><path d="M460 64 580 154" fill="none" stroke="#eef4f2" stroke-width="12"/><g fill="#f2f5f4"><rect x="438" y="115" width="18" height="18"/><rect x="461" y="115" width="18" height="18"/><rect x="438" y="138" width="18" height="18"/><rect x="461" y="138" width="18" height="18"/></g><g class="brush" transform="rotate(34 650 95)"><rect x="635" y="20" width="30" height="100" rx="13" fill="#dce5e8"/><rect x="630" y="95" width="40" height="18" rx="4" fill="#718e98"/><path d="M632 113h36l-5 46h-26z" fill="#78c5be"/></g><g class="word" font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="450" y="326" font-size="164" font-weight="800" letter-spacing="-10" fill="#f1f4f3">D<tspan fill="#78c5be">&amp;</tspan>M</text><text x="450" y="386" font-size="36" letter-spacing="9" fill="#e8eeee">PAINTING &amp; DECORATING</text></g></svg>